# LIORA Creative Studio – editing setup for Pages CMS (pagescms.org)
media:
  - name: images
    label: Photos
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: files
    label: Videos and PDFs
    input: media/files
    output: /media/files
    rename: safe
content:
  - name: site
    label: "Home page & site settings"
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_hi
        type: string
        label: "Hero – small line"
      - name: hero_first
        type: string
        label: "Hero – first name"
      - name: hero_last
        type: string
        label: "Hero – surname"
      - name: founder
        type: string
        label: "Hero – founder line"
      - name: hero_button
        type: string
        label: "Hero – button text"
      - name: my_photo
        type: image
        label: "Your photo (home page)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: story_heading
        type: string
        label: "Story – heading"
      - name: story_p1
        type: text
        label: "Story – paragraph 1"
      - name: story_p2
        type: text
        label: "Story – paragraph 2"
      - name: offer_heading
        type: string
        label: "Services section – heading"
      - name: offer_intro
        type: text
        label: "Services section – intro"
      - name: offer1_title
        type: string
        label: "Service row 1 – title"
      - name: offer1_desc
        type: string
        label: "Service row 1 – text"
      - name: offer2_title
        type: string
        label: "Service row 2 – title"
      - name: offer2_desc
        type: string
        label: "Service row 2 – text"
      - name: offer3_title
        type: string
        label: "Service row 3 – title"
      - name: offer3_desc
        type: string
        label: "Service row 3 – text"
      - name: studio_kicker
        type: string
        label: "Photo-reveal strip – small text"
      - name: reviews_label
        type: string
        label: "Reviews – small heading"
      - name: marquee
        type: string
        label: "Moving banner text"
      - name: form_heading
        type: text
        label: "Enquiry form – heading"
      - name: random_photos
        type: image
        label: "Photos that pop up on the intro and the cursor strip"
        description: "Add as many as you like. If empty, placeholder tones are shown."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: email
        type: string
        label: "Email address"
      - name: linkedin
        type: string
        label: "LinkedIn link"
      - name: instagram
        type: string
        label: "Instagram link"
      - name: tiktok
        type: string
        label: "TikTok link"
      - name: youtube
        type: string
        label: "YouTube link (leave empty to hide)"
      - name: review_link
        type: string
        label: "Google review link (leave empty to hide the review button and footer link)"
      - name: review_button
        type: string
        label: "Review button text (under client reviews)"
      - name: footer_text
        type: string
        label: "Footer text"
      - name: guide_heading
        type: string
        label: "Pricing guide – heading"
      - name: guide_text
        type: text
        label: "Pricing guide – text"
      - name: guide_pdf
        type: file
        label: "Pricing guide PDF"
        description: "Upload the PDF here. The Download button on the Services page uses it."
        options:
          media: files
          extensions: [pdf]
      - name: form_key
        type: string
        label: "Contact form key (from web3forms.com)"
        description: "Paste your free Web3Forms access key so enquiries reach your inbox."
  - name: reviews
    label: "Reviews (home page)"
    type: file
    path: content/reviews.json
    format: json
    list: true
    fields:
      - name: text
        type: text
        label: "Review"
      - name: by
        type: string
        label: "Name | Service"
  - name: categories
    label: "Portfolio menu pictures"
    type: file
    path: content/categories.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: "Name"
      - name: to
        type: string
        label: "Link (leave as is)"
      - name: img
        type: image
        label: "Picture that appears on hover"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: focus_x
        type: number
        label: "Phone photo focus – left/right (0 = far left, 50 = centre, 100 = far right)"
      - name: focus_y
        type: number
        label: "Phone photo focus – up/down (0 = top, 50 = centre, 100 = bottom)"
  - name: pages
    label: "Page text (portrait, event, design, pricing, FAQs)"
    type: file
    path: content/pages.json
    format: json
    fields:
      - name: portrait_text
        type: text
        label: "Portrait page – text"
        description: "Leave a blank line between paragraphs."
      - name: portrait_tagline
        type: string
        label: "Portrait page – slogan"
      - name: event_text
        type: text
        label: "Event page – text"
        description: "Leave a blank line between paragraphs."
      - name: event_tagline
        type: string
        label: "Event page – slogan"
      - name: design_intro
        type: text
        label: "Graphic design page – intro"
        description: "Leave a blank line between paragraphs."
      - name: design_tagline
        type: string
        label: "Graphic design page – slogan"
      - name: pricing_intro
        type: text
        label: "Pricing page – intro"
      - name: booking_heading
        type: string
        label: "Services page – booking process heading"
      - name: faq_intro
        type: text
        label: "FAQs page – intro"
      - name: itinerary_text
        type: text
        label: "Graphic design page – travel itinerary design text"
        description: "Shown under the poster wall. Leave a blank line between paragraphs."
  - name: portrait
    label: "Portrait photos"
    type: file
    path: content/portrait-photos.json
    format: json
    list: true
    fields:
      - name: img
        type: image
        label: "Photo (shown in the gallery)"
        description: "Upload a JPG about 2000px wide for fast loading."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: hd
        type: image
        label: "Larger version (optional)"
        description: "Shown when the photo is clicked. Leave empty to reuse the photo."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: featured
        type: boolean
        label: "Show slightly larger (optional)"
        description: "Tick for your favourite shots. They show a touch bigger than the others in the grid."
      - name: caption
        type: string
        label: "Caption (used for screen readers)"
      - name: year
        type: string
        label: "Year"
  - name: event
    label: "Event photos"
    type: file
    path: content/event-photos.json
    format: json
    list: true
    fields:
      - name: img
        type: image
        label: "Photo (shown in the gallery)"
        description: "Upload a JPG about 2000px wide for fast loading."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: hd
        type: image
        label: "Larger version (optional)"
        description: "Shown when the photo is clicked. Leave empty to reuse the photo."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: featured
        type: boolean
        label: "Show slightly larger (optional)"
        description: "Tick for your favourite shots. They show a touch bigger than the others in the grid."
      - name: caption
        type: string
        label: "Caption (used for screen readers)"
      - name: year
        type: string
        label: "Year"
  - name: projects
    label: "Graphic design – projects"
    type: file
    path: content/design-projects.json
    format: json
    list: true
    fields:
      - name: title
        type: string
        label: "Title"
      - name: subtitle
        type: string
        label: "Subtitle"
      - name: img
        type: image
        label: "Cover image"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: desc
        type: text
        label: "Description"
      - name: details
        type: text
        label: "Details"
        description: "One per line, like  Role: Designer"
      - name: images
        type: image
        label: "Project images (first one is shown large)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_1
        type: image
        label: "Slideshow 1 (optional) – photos (3-4, changes every 2 seconds)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_1_after
        type: number
        label: "Slideshow 1 – show after photo number"
        description: "0 = before the first photo. Leave empty to put it at the end."
      - name: slideshow_2
        type: image
        label: "Slideshow 2 (optional) – photos (3-4, changes every 2 seconds)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_2_after
        type: number
        label: "Slideshow 2 – show after photo number"
        description: "0 = before the first photo. Leave empty to put it at the end."
      - name: slideshow_3
        type: image
        label: "Slideshow 3 (optional) – photos (3-4, changes every 2 seconds)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_3_after
        type: number
        label: "Slideshow 3 – show after photo number"
        description: "0 = before the first photo. Leave empty to put it at the end."
      - name: slideshow_4
        type: image
        label: "Slideshow 4 (optional) – photos (3-4, changes every 2 seconds)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_4_after
        type: number
        label: "Slideshow 4 – show after photo number"
        description: "0 = before the first photo. Leave empty to put it at the end."
  - name: posters
    label: "Graphic design – poster wall"
    type: file
    path: content/posters.json
    format: json
    list: true
    fields:
      - name: img
        type: image
        label: "Photo (shown in the gallery)"
        description: "Upload a JPG about 2000px wide for fast loading."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: hd
        type: image
        label: "Larger version (optional)"
        description: "Shown when the photo is clicked. Leave empty to reuse the photo."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: alt
        type: image
        label: "In-place photo (optional)"
        description: "Shown when the enlarged poster is clicked, e.g. a mockup on a wall."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: caption
        type: string
        label: "Caption (used for screen readers)"
      - name: year
        type: string
        label: "Year"
  - name: commissions
    label: "Graphic design – one-off commissions"
    type: file
    path: content/commissions.json
    format: json
    list: true
    fields:
      - name: img
        type: image
        label: "Photo (shown in the gallery)"
        description: "Upload a JPG about 2000px wide for fast loading."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: hd
        type: image
        label: "Larger version (optional)"
        description: "Shown when the photo is clicked. Leave empty to reuse the photo."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: featured
        type: boolean
        label: "Show slightly larger (optional)"
        description: "Tick for your favourite shots. They show a touch bigger than the others in the grid."
      - name: caption
        type: string
        label: "Caption (used for screen readers)"
      - name: year
        type: string
        label: "Year"
  - name: trips
    label: "Itinerary designs (graphic design page)"
    type: file
    path: content/trips.json
    format: json
    list: true
    fields:
      - name: title
        type: string
        label: "Destination"
      - name: subtitle
        type: string
        label: "Subtitle"
      - name: cover
        type: image
        label: "Cover image"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: desc
        type: text
        label: "Short note"
      - name: details
        type: text
        label: "Details"
        description: "One per line, like  Dates: June 2026"
      - name: slideshow
        type: image
        label: "Slideshow photos (change every 2 seconds)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: slideshow_caption
        type: string
        label: "Slideshow caption"
      - name: itinerary_screenshots
        type: image
        label: "Itinerary screenshots"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: map_image
        type: image
        label: "Map picture (optional)"
        description: "Optional: a map screenshot centred on the city. Leave empty to use the built-in pin map from the coordinates below."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: latitude
        type: string
        label: "Map pin – latitude"
        description: "e.g. 52.5200 for Berlin (search the city on Google Maps, right-click the map, click the numbers)."
      - name: longitude
        type: string
        label: "Map pin – longitude"
        description: "e.g. 13.4050 for Berlin."
      - name: moments
        type: image
        label: "Moments (photos)"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: moment_videos
        type: file
        label: "Moments (videos, MP4)"
        description: "Short clips play silently on a loop. Keep each under about 25 MB (upload via GitHub if too big for the editor)."
        options:
          media: files
          extensions: [mp4, mov, webm]
          multiple: true
      - name: review1_text
        type: text
        label: "Review 1"
      - name: review1_by
        type: string
        label: "Review 1 – name"
      - name: review2_text
        type: text
        label: "Review 2"
      - name: review2_by
        type: string
        label: "Review 2 – name"
      - name: review3_text
        type: text
        label: "Review 3 (optional)"
      - name: review3_by
        type: string
        label: "Review 3 – name"
  - name: services
    label: "Services & prices"
    type: file
    path: content/services.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: "Service name"
      - name: desc
        type: text
        label: "Description"
      - name: price
        type: string
        label: "Price button text"
        description: "e.g. FROM £100"
      - name: link
        type: string
        label: "Price button link (optional)"
        description: "Leave empty to jump to this service on the pricing page automatically."
      - name: img
        type: image
        label: "Background photo"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: focus_x
        type: number
        label: "Phone photo focus – left/right (0 = far left, 50 = centre, 100 = far right)"
      - name: focus_y
        type: number
        label: "Phone photo focus – up/down (0 = top, 50 = centre, 100 = bottom)"
  - name: instagram
    label: "Contact – Instagram posts"
    type: file
    path: content/instagram-posts.json
    format: json
    list: true
    fields:
      - name: type
        type: select
        label: "Post type"
        options:
          values: [image, carousel, video]
      - name: images
        type: image
        label: "Image(s) – one for an image, several for a swipeable carousel"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: video
        type: file
        label: "Video (for video posts)"
        options:
          media: files
          extensions: [mp4, mov, webm]
      - name: video_1
        type: file
        label: "Carousel video 1 (optional)"
        description: "Add a video into a carousel post."
        options:
          media: files
          extensions: [mp4, mov, webm]
      - name: video_1_at
        type: number
        label: "Carousel video 1 – slide number"
        description: "Which slide it appears as: 1 = first, 3 = third. Leave empty to put it last."
      - name: video_2
        type: file
        label: "Carousel video 2 (optional)"
        description: "Add a video into a carousel post."
        options:
          media: files
          extensions: [mp4, mov, webm]
      - name: video_2_at
        type: number
        label: "Carousel video 2 – slide number"
        description: "Which slide it appears as: 1 = first, 3 = third. Leave empty to put it last."
      - name: video_3
        type: file
        label: "Carousel video 3 (optional)"
        description: "Add a video into a carousel post."
        options:
          media: files
          extensions: [mp4, mov, webm]
      - name: video_3_at
        type: number
        label: "Carousel video 3 – slide number"
        description: "Which slide it appears as: 1 = first, 3 = third. Leave empty to put it last."
      - name: link
        type: string
        label: "Link to the post"
  - name: tiktok
    label: "Contact – TikTok posts"
    type: file
    path: content/tiktok-posts.json
    format: json
    list: true
    fields:
      - name: type
        type: select
        label: "Post type"
        options:
          values: [image, carousel, video]
      - name: images
        type: image
        label: "Image(s) – one for an image, several for a swipeable carousel"
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          multiple: true
      - name: video
        type: file
        label: "Video (for video posts)"
        options:
          media: files
          extensions: [mp4, mov, webm]
      - name: link
        type: string
        label: "Link to the post"
  - name: pricing
    label: "Pricing page – services & packages"
    type: file
    path: content/pricing.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: "Service name"
      - name: slug
        type: string
        label: "Link name"
        description: "Short, lowercase, no spaces (e.g. portrait). Services page buttons use it to jump to this section."
      - name: from
        type: string
        label: "Starting price"
        description: "e.g. £100"
      - name: banner
        type: image
        label: "Banner photo"
        description: "Wide photo shown at the top of this service's section."
        options:
          media: images
          extensions: [jpg, jpeg, png, webp, mp4]
      - name: intro
        type: text
        label: "Intro"
        description: "Leave a blank line between paragraphs."
      - name: packages
        type: object
        list: true
        label: "Packages"
        fields:
          - name: group
            type: string
            label: "Group (optional)"
            description: "Packages with the same group are shown together under that heading, e.g. Branding."
          - name: name
            type: string
            label: "Package name"
          - name: price
            type: string
            label: "Price"
            description: "e.g. £150 (shown as 'from £150')"
          - name: best_for
            type: string
            label: "Best for"
          - name: details
            type: text
            label: "What's included"
            description: "One item per line."
      - name: included
        type: text
        label: "Included with every booking"
        description: "One item per line."
      - name: addons
        type: text
        label: "Add-ons"
        description: "One per line. Put the add-on name before a colon to make it bold, e.g. Extra hour: for events that run long"
      - name: notes
        type: text
        label: "Good to know"
        description: "One item per line."
  - name: bundles
    label: "Pricing page – bundles"
    type: file
    path: content/bundles.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: "Bundle name"
      - name: price
        type: string
        label: "Price"
        description: "e.g. from £725"
      - name: desc
        type: string
        label: "What's included"
  - name: booking
    label: "Services page – booking process steps"
    type: file
    path: content/booking.json
    format: json
    list: true
    fields:
      - name: title
        type: string
        label: "Step title"
      - name: text
        type: text
        label: "Step description"
  - name: faqs
    label: "FAQs"
    type: file
    path: content/faqs.json
    format: json
    list: true
    fields:
      - name: category
        type: string
        label: "Category"
        description: "Questions with the same category are grouped together, e.g. Web design."
      - name: question
        type: string
        label: "Question"
      - name: answer
        type: text
        label: "Answer"
  - name: terms
    label: "Terms & Conditions"
    type: file
    path: content/terms.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: "Service name"
      - name: body
        type: text
        label: "Terms"
        description: "## = clause heading, ### = sub-heading, lines starting with - are bullet points, blank line = new paragraph."
